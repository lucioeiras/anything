name: Release builds

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-builds-main
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK and IPA
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || vars.EXPO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun ci

      - name: Validate Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Configure EXPO_TOKEN em Settings > Secrets and variables > Actions no repositório."
            exit 1
          fi

      - name: Build Android and iOS
        id: eas-build
        run: eas build --platform all --profile release --non-interactive --wait --json > eas-builds.json

      - name: Download build artifacts
        run: |
          mkdir -p artifacts
          ANDROID_BUILD_ID="$(jq -r '.[] | select(.platform == "ANDROID") | .id' eas-builds.json)"
          IOS_BUILD_ID="$(jq -r '.[] | select(.platform == "IOS") | .id' eas-builds.json)"
          test -n "$ANDROID_BUILD_ID"
          test -n "$IOS_BUILD_ID"
          eas build:download --build-id "$ANDROID_BUILD_ID" --non-interactive
          mv ./*.apk artifacts/anything.apk
          eas build:download --build-id "$IOS_BUILD_ID" --non-interactive
          mv ./*.ipa artifacts/anything.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-${{ github.run_number }}-${{ github.run_attempt }}
          name: Release build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            artifacts/anything.apk
            artifacts/anything.ipa
